<div id="module-policies" class="module-container" style="display:none;">
  <div class="page-header">
    <div>
      <h1 class="page-title">Company Policies & Handbook</h1>
      <p class="page-subtitle">Organizational guidelines, code of conduct, and mandatory digital acknowledgements.</p>
    </div>
    <div>
      <button class="btn btn-primary btn-sm" id="btn-add-policy" onclick="openAddPolicyModal()" style="display:none;">
        <span class="icon-slot" data-icon="plus"></span>
        <span>Upload Policy</span>
      </button>
    </div>
  </div>

  <!-- Policies Grid -->
  <div id="policies-cards-mount" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:20px;">
    <!-- Populated via JS -->
  </div>
</div>

<script>
let policiesCache = [];

function loadModule_policies() {
  const user = App.user;
  if (user && (user.role === 'admin' || user.role === 'hr')) {
    document.getElementById('btn-add-policy').style.display = 'inline-flex';
  }

  callApi('Api_Policies_list', [], function(list) {
    policiesCache = list || [];
    renderPolicies(policiesCache);
  }, showToastError);
}

function renderPolicies(list) {
  const mount = document.getElementById('policies-cards-mount');
  if (!mount) return;

  if (!list.length) {
    mount.innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center; padding:40px; color:var(--sd-text-muted);">No company policies published yet.</div>`;
    return;
  }

  mount.innerHTML = list.map(p => `
    <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;">
      <div>
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <span class="pill pill-holiday">${p.category}</span>
          ${p.mandatoryAck ? (p.isAcknowledged ? `<span class="pill pill-approved">✓ Acknowledged</span>` : `<span class="pill pill-danger">Action Required</span>`) : ''}
        </div>
        <h4 style="font-size:16px; font-weight:700; color:var(--sd-text-primary); margin-bottom:6px;">${p.title}</h4>
        <p style="font-size:13px; color:var(--sd-text-secondary); line-height:1.5; margin-bottom:14px;">${p.description || 'Official organizational handbook document.'}</p>
      </div>

      <div style="border-top:1px solid var(--sd-border-light); padding-top:14px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11.5px; color:var(--sd-text-muted);">v${p.version} • ${p.effectiveDate}</span>
        <div style="display:flex; gap:8px;">
          ${p.documentUrl ? `<a href="${p.documentUrl}" target="_blank" class="btn btn-secondary btn-sm">Read PDF</a>` : ''}
          ${(p.mandatoryAck && !p.isAcknowledged) ? `
            <button class="btn btn-primary btn-sm" onclick="acknowledgePolicy('${p.policyId}')">Acknowledge</button>
          ` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function acknowledgePolicy(policyId) {
  callApi('Api_Policies_acknowledge', [policyId], function() {
    showToast('Policy acknowledged and recorded in your compliance profile ✓', 'success');
    loadModule_policies();
  }, showToastError);
}

function openAddPolicyModal() {
  const bodyHtml = `
    <form id="add-policy-form">
      <div class="form-group">
        <label class="form-label">Policy Title *</label>
        <input type="text" id="pol-title" class="form-control" placeholder="Remote Work & Cyber Security Policy" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <input type="text" id="pol-category" class="form-control" placeholder="HR, IT, Code of Conduct" required>
        </div>
        <div class="form-group">
          <label class="form-label">Version</label>
          <input type="text" id="pol-version" class="form-control" value="1.0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Google Drive Document / PDF URL</label>
        <input type="url" id="pol-url" class="form-control" placeholder="https://drive.google.com/file/d/...">
      </div>
      <div class="form-group">
        <label class="form-label">Description / Summary</label>
        <textarea id="pol-desc" class="form-control" placeholder="Brief overview..."></textarea>
      </div>
      <div class="form-group">
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
          <input type="checkbox" id="pol-mandatory" checked>
          <span>Require Mandatory Digital Acknowledgement from all employees</span>
        </label>
      </div>
    </form>
  `;

  showAppModal('Upload & Publish Policy', bodyHtml, 'Publish Policy', function() {
    const payload = {
      title: document.getElementById('pol-title').value,
      category: document.getElementById('pol-category').value,
      version: document.getElementById('pol-version').value,
      documentUrl: document.getElementById('pol-url').value,
      description: document.getElementById('pol-desc').value,
      mandatoryAck: document.getElementById('pol-mandatory').checked,
      effectiveDate: new Date().toISOString().split('T')[0],
      requestId: newRequestId()
    };

    if (!payload.title || !payload.category) {
      showToast('Title and Category are required.', 'warning');
      return;
    }

    callApi('Api_Policies_create', [payload], function() {
      closeAppModal();
      showToast('Policy published and broadcasted to team ✓', 'success');
      loadModule_policies();
    }, showToastError);
  });
}
</script>
