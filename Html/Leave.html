<div id="module-leave" class="module-container" style="display:none;">
  <div class="page-header">
    <div>
      <h1 class="page-title">Leave & Time Off</h1>
      <p class="page-subtitle">Apply for time off, view live balances, and track manager approval statuses.</p>
    </div>
  </div>

  <!-- Sub-Tabs: Apply vs My Requests vs Approvals -->
  <div style="display:flex; gap:16px; margin-bottom:20px; border-bottom:1px solid var(--sd-border); padding-bottom:12px;">
    <button class="btn btn-secondary btn-sm active-tab" id="tab-leave-apply" onclick="switchLeaveTab('apply')">Apply for Leave</button>
    <button class="btn btn-secondary btn-sm" id="tab-leave-my" onclick="switchLeaveTab('my')">My Requests</button>
    <button class="btn btn-secondary btn-sm" id="tab-leave-approvals" onclick="switchLeaveTab('approvals')" style="display:none;">
      Pending Approvals <span class="pill pill-pending" id="badge-leave-approvals" style="margin-left:6px; display:none;">0</span>
    </button>
  </div>

  <div style="display:grid; grid-template-columns:1fr 300px; gap:24px;" id="leave-main-layout">
    <!-- Main Form / Table Area -->
    <div>
      <!-- Section: Apply Form -->
      <div id="leave-apply-container" class="card">
        <h3 class="card-title" style="margin-bottom:18px;">New Leave Application</h3>
        <form id="leave-apply-form" onsubmit="event.preventDefault(); submitLeaveApplication();">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Leave Type *</label>
              <select id="leave-type-select" class="form-control" onchange="updateSandwichPreview()" required>
                <option value="Casual">Casual Leave</option>
                <option value="Sick">Sick Leave</option>
                <option value="Earned">Earned / Privilege Leave</option>
                <option value="Unpaid">Unpaid Leave (Loss of Pay)</option>
              </select>
            </div>
            <div class="form-group" style="display:flex; align-items:center; margin-top:24px;">
              <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer;">
                <input type="checkbox" id="leave-half-day" onchange="toggleHalfDay(this.checked)">
                <span>Half-Day Request</span>
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">From Date *</label>
              <input type="date" id="leave-from-date" class="form-control" onchange="updateSandwichPreview()" required>
            </div>
            <div class="form-group" id="group-leave-to-date">
              <label class="form-label">To Date *</label>
              <input type="date" id="leave-to-date" class="form-control" onchange="updateSandwichPreview()" required>
            </div>
            <div class="form-group" id="group-half-session" style="display:none;">
              <label class="form-label">Half-Day Session</label>
              <select id="leave-half-session" class="form-control">
                <option value="AM">First Half (AM)</option>
                <option value="PM">Second Half (PM)</option>
              </select>
            </div>
          </div>

          <!-- Dynamic Sandwich / Working Days Calculation Banner -->
          <div id="leave-calc-preview" style="background:#EFF6FF; border-left:4px solid #2563EB; padding:12px 16px; border-radius:6px; margin-bottom:18px; font-size:13px; color:#1F2937; display:none;">
            <!-- Message populated via JS -->
          </div>

          <div class="form-group">
            <label class="form-label">Reason for Absence *</label>
            <textarea id="leave-reason" class="form-control" placeholder="Please provide brief context for your reporting manager..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-submit-leave">
            <span>Submit Application</span>
          </button>
        </form>
      </div>

      <!-- Section: My Requests -->
      <div id="leave-my-container" class="card" style="display:none;">
        <h3 class="card-title" style="margin-bottom:18px;">My Leave History</h3>
        <div class="table-container" style="border:none; box-shadow:none;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Dates</th>
                <th>Days</th>
                <th>Reason</th>
                <th>Status</th>
                <th style="text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody id="leave-my-tbody">
              <!-- Populated via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Section: Approvals Queue -->
      <div id="leave-approvals-container" class="card" style="display:none;">
        <h3 class="card-title" style="margin-bottom:18px;">Team Leave Requests</h3>
        <div id="leave-approvals-mount">
          <!-- Populated via JS -->
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Live Balances -->
    <div>
      <div class="card">
        <h3 class="card-title" style="margin-bottom:16px;">Leave Balances</h3>
        <div id="leave-balances-widget">
          <!-- Balance Progress Bars populated via JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let leaveMyData = null;

function loadModule_leave() {
  const user = App.user;
  if (user && (user.role === 'manager' || user.role === 'hr' || user.role === 'admin')) {
    const tab = document.getElementById('tab-leave-approvals');
    if (tab) tab.style.display = 'inline-flex';
    loadLeaveApprovalsCount();
  }

  const today = new Date().toISOString().split('T')[0];
  const fromEl = document.getElementById('leave-from-date');
  const toEl = document.getElementById('leave-to-date');
  if (fromEl && !fromEl.value) fromEl.value = today;
  if (toEl && !toEl.value) toEl.value = today;

  loadMyLeaveData();
  updateSandwichPreview();
}

function loadMyLeaveData() {
  callApi('Api_Leave_getMyRequests', [], function(data) {
    leaveMyData = data;
    renderLeaveBalances(data.balances || []);
    renderMyLeaveHistory(data.requests || []);
  }, showToastError);
}

function renderLeaveBalances(balances) {
  const mount = document.getElementById('leave-balances-widget');
  if (!mount) return;

  if (!balances.length) {
    mount.innerHTML = `<p style="font-size:13px; color:var(--sd-text-muted);">No balances recorded.</p>`;
    return;
  }

  mount.innerHTML = balances.map(b => {
    const total = (b.opening || 0) + (b.accrued || 0) + (b.adjusted || 0);
    const percent = total > 0 ? Math.round((b.balance / total) * 100) : 0;
    return `
      <div style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
          <strong style="color:var(--sd-text-primary);">${b.leaveType}</strong>
          <span><strong>${b.balance}</strong> / ${total} days</span>
        </div>
        <div style="height:6px; background:var(--sd-surface-subtle); border-radius:99px; overflow:hidden;">
          <div style="width:${percent}%; height:100%; background:var(--sd-primary);"></div>
        </div>
      </div>
    `;
  }).join('');
}

function renderMyLeaveHistory(requests) {
  const tbody = document.getElementById('leave-my-tbody');
  if (!tbody) return;

  if (!requests.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--sd-text-muted);">No leave requests submitted yet.</td></tr>`;
    return;
  }

  tbody.innerHTML = requests.map(r => `
    <tr>
      <td><strong>${r.leaveType}</strong></td>
      <td>${r.fromDate} ${r.fromDate !== r.toDate ? '→ ' + r.toDate : ''}</td>
      <td><strong>${r.dayCount}d</strong> ${r.isHalfDay ? `(${r.halfSession})` : ''}</td>
      <td><span style="font-size:12px; color:var(--sd-text-secondary);">${r.reason || '—'}</span></td>
      <td><span class="pill pill-${r.status.toLowerCase()}">${r.status}</span></td>
      <td style="text-align:right;">
        ${r.status === 'Pending' ? `
          <button class="btn btn-secondary btn-sm" onclick="cancelLeave('${r.leaveId}')">Cancel</button>
        ` : '—'}
      </td>
    </tr>
  `).join('');
}

function toggleHalfDay(isHalf) {
  document.getElementById('group-leave-to-date').style.display = isHalf ? 'none' : 'block';
  document.getElementById('group-half-session').style.display = isHalf ? 'block' : 'none';
  if (isHalf) {
    document.getElementById('leave-to-date').value = document.getElementById('leave-from-date').value;
  }
  updateSandwichPreview();
}

function updateSandwichPreview() {
  const fromDate = document.getElementById('leave-from-date')?.value;
  const isHalf = document.getElementById('leave-half-day')?.checked;
  const toDate = isHalf ? fromDate : document.getElementById('leave-to-date')?.value;
  const type = document.getElementById('leave-type-select')?.value || 'Casual';

  if (!fromDate || !toDate) return;

  callApi('Api_Leave_previewDayCount', [fromDate, toDate, type, isHalf], function(res) {
    const banner = document.getElementById('leave-calc-preview');
    if (banner && res && res.message) {
      banner.textContent = res.message;
      banner.style.display = 'block';
    }
  });
}

function submitLeaveApplication() {
  const isHalf = document.getElementById('leave-half-day').checked;
  const fromDate = document.getElementById('leave-from-date').value;
  const toDate = isHalf ? fromDate : document.getElementById('leave-to-date').value;

  const payload = {
    leaveType: document.getElementById('leave-type-select').value,
    fromDate: fromDate,
    toDate: toDate,
    isHalfDay: isHalf,
    halfSession: isHalf ? document.getElementById('leave-half-session').value : '',
    reason: document.getElementById('leave-reason').value,
    requestId: newRequestId()
  };

  const btn = document.getElementById('btn-submit-leave');
  btn.disabled = true;

  callApi('Api_Leave_apply', [payload], function(res) {
    btn.disabled = false;
    showToast(`Leave application for ${res.dayCount} day(s) submitted successfully`, 'success');
    document.getElementById('leave-reason').value = '';
    loadMyLeaveData();
    switchLeaveTab('my');
  }, function(err) {
    btn.disabled = false;
    showToastError(err);
  });
}

function cancelLeave(leaveId) {
  if (!confirm('Are you sure you want to cancel this leave request?')) return;
  callApi('Api_Leave_cancel', [leaveId], function() {
    showToast('Leave request cancelled', 'success');
    loadMyLeaveData();
  }, showToastError);
}

function switchLeaveTab(tab) {
  document.getElementById('tab-leave-apply').classList.toggle('active-tab', tab === 'apply');
  document.getElementById('tab-leave-my').classList.toggle('active-tab', tab === 'my');
  document.getElementById('tab-leave-approvals').classList.toggle('active-tab', tab === 'approvals');

  document.getElementById('leave-apply-container').style.display = tab === 'apply' ? 'block' : 'none';
  document.getElementById('leave-my-container').style.display = tab === 'my' ? 'block' : 'none';
  document.getElementById('leave-approvals-container').style.display = tab === 'approvals' ? 'block' : 'none';

  if (tab === 'approvals') {
    loadLeaveApprovals();
  }
}

function loadLeaveApprovalsCount() {
  callApi('Api_Leave_getApprovals', [], function(list) {
    const badge = document.getElementById('badge-leave-approvals');
    if (badge && list && list.length > 0) {
      badge.textContent = list.length;
      badge.style.display = 'inline-flex';
    }
  });
}

function loadLeaveApprovals() {
  callApi('Api_Leave_getApprovals', [], function(list) {
    const mount = document.getElementById('leave-approvals-mount');
    if (!mount) return;

    if (!list || !list.length) {
      mount.innerHTML = `<p style="text-align:center; padding:40px; color:var(--sd-text-muted);">No pending leave approvals in your queue</p>`;
      return;
    }

    mount.innerHTML = list.map(item => `
      <div class="card" style="margin-bottom:16px; border-left:4px solid var(--sd-accent);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <h4 style="font-size:15px; font-weight:700;">${item.employeeName} <code style="font-size:11px; color:var(--sd-text-muted);">(${item.empId})</code></h4>
            <p style="font-size:12.5px; color:var(--sd-text-muted); margin-bottom:8px;">${item.department}</p>
            <p style="font-size:13.5px; color:var(--sd-text-primary); margin-bottom:4px;">
              <strong>${item.leaveType} Leave:</strong> ${item.fromDate} to ${item.toDate} (<strong>${item.dayCount} days</strong>)
            </p>
            <p style="font-size:13px; color:var(--sd-text-secondary); font-style:italic;">"${item.reason || 'No reason provided'}"</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary btn-sm" onclick="approveLeave('${item.leaveId}')">Approve</button>
            <button class="btn btn-danger btn-sm" onclick="openRejectLeaveModal('${item.leaveId}')">Reject</button>
          </div>
        </div>
      </div>
    `).join('');
  }, showToastError);
}

function approveLeave(leaveId) {
  callApi('Api_Leave_approve', [leaveId, 'Approved'], function() {
    showToast('Leave request approved', 'success');
    loadLeaveApprovals();
    loadLeaveApprovalsCount();
  }, showToastError);
}

function openRejectLeaveModal(leaveId) {
  const bodyHtml = `
    <div class="form-group">
      <label class="form-label">Rejection Remark * (Sent to employee)</label>
      <textarea id="leave-reject-remarks" class="form-control" placeholder="Provide reason for rejection..." required></textarea>
    </div>
  `;

  showAppModal('Decline Leave Request', bodyHtml, 'Confirm Rejection', function() {
    const remarks = document.getElementById('leave-reject-remarks')?.value;
    if (!remarks) {
      showToast('Rejection remark is required.', 'warning');
      return;
    }
    callApi('Api_Leave_reject', [leaveId, remarks], function() {
      closeAppModal();
      showToast('Leave request rejected', 'info');
      loadLeaveApprovals();
      loadLeaveApprovalsCount();
    }, showToastError);
  });
}
</script>
