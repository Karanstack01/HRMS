<script>
  /**
   * AppCore.html — Client-side State, API Dispatcher, Toast, Routing & Skeleton Helpers
   */
  const App = {
    user: { fullName: 'Staff User', role: 'employee', department: 'Engineering' },
    nav: [],
    orgName: 'StackDrove',
    currency: 'INR',
    punchStatus: { isPunchedIn: false, todayRecord: null },
    currentModule: 'dashboard'
  };

  function callApi(functionName, args, onSuccess, onFailure) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      let runner = google.script.run
        .withSuccessHandler(function(response) {
          if (response && response.success === false) {
            if (typeof onFailure === 'function') onFailure(response.error);
            else showToastError(response.error);
          } else {
            const data = (response && response.data !== undefined) ? response.data : response;
            if (typeof onSuccess === 'function') onSuccess(data);
          }
        })
        .withFailureHandler(function(error) {
          if (typeof onFailure === 'function') onFailure(error);
          else showToastError(error);
        });

      if (typeof runner[functionName] === 'function') {
        runner[functionName].apply(runner, args || []);
      } else {
        console.error('API function not found on server:', functionName);
        if (typeof onFailure === 'function') onFailure({ message: 'Function not found: ' + functionName });
      }
    } else {
      console.warn('Google Apps Script environment not detected. Running offline.');
      if (typeof onSuccess === 'function') onSuccess(null);
    }
  }

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showToast(message, type) {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = 'toast';
    let iconSvg = '<svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>';
    if (type === 'error') {
      toast.className = 'toast toast-error';
      iconSvg = '<svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    } else if (type === 'warning') {
      toast.className = 'toast toast-warning';
      iconSvg = '<svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    } else if (type === 'info') {
      toast.className = 'toast';
      iconSvg = '<svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
    } else {
      toast.className = 'toast toast-success';
    }

    toast.innerHTML = `<span style="display:inline-flex;align-items:center;">${iconSvg}</span> <span>${message}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
      if (toast.parentElement) {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(16px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }
    }, 4200);
  }

  function showToastError(err) {
    const msg = (err && err.message) ? err.message : String(err || 'An error occurred.');
    showToast(msg, 'error');
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar-wrapper');
    if (!sidebar) return;
    const isCollapsed = sidebar.classList.toggle('collapsed');
    try {
      localStorage.setItem('sd_sidebar_collapsed', isCollapsed ? '1' : '0');
    } catch (e) {}
  }

  function applySidebarState() {
    try {
      if (localStorage.getItem('sd_sidebar_collapsed') === '1') {
        const sidebar = document.getElementById('sidebar-wrapper');
        if (sidebar) sidebar.classList.add('collapsed');
      }
    } catch (e) {}
  }

  /* Theme Switcher Management */
  function initTheme() {
    try {
      const savedTheme = localStorage.getItem('sd_theme') || 'light';
      applyTheme(savedTheme, false);
    } catch (e) {
      applyTheme('light', false);
    }
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(newTheme, true);
  }

  function applyTheme(theme, showNotice) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      localStorage.setItem('sd_theme', theme);
    } catch (e) {}

    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');
    const toggleBtn = document.getElementById('btn-theme-toggle');

    if (theme === 'dark') {
      if (sunIcon) sunIcon.style.display = 'block';
      if (moonIcon) moonIcon.style.display = 'none';
      if (toggleBtn) {
        toggleBtn.style.background = 'rgba(255, 255, 255, 0.08)';
        toggleBtn.style.borderColor = 'rgba(255, 255, 255, 0.15)';
        toggleBtn.style.color = '#F59E0B';
      }
    } else {
      if (sunIcon) sunIcon.style.display = 'none';
      if (moonIcon) moonIcon.style.display = 'block';
      if (toggleBtn) {
        toggleBtn.style.background = '#F5F7FA';
        toggleBtn.style.borderColor = '#E5E7EB';
        toggleBtn.style.color = '#64748B';
      }
    }
    if (showNotice && typeof showToast === 'function') {
      showToast('Switched to ' + (theme === 'dark' ? 'Dark' : 'Light') + ' theme', 'info');
    }
  }

  // Eagerly apply theme to prevent flash
  initTheme();

  function initNavTooltips() {
    let tooltip = document.getElementById('sd-global-tooltip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.id = 'sd-global-tooltip';
      tooltip.className = 'sd-nav-tooltip';
      document.body.appendChild(tooltip);
    }
    
    document.addEventListener('mouseover', function(e) {
      const item = e.target.closest('.nav-item');
      if (item) {
        const sidebar = document.getElementById('sidebar-wrapper');
        if (!sidebar || !sidebar.classList.contains('collapsed')) return;
        
        const title = item.getAttribute('data-title');
        if (!title) return;
        
        const rect = item.getBoundingClientRect();
        tooltip.textContent = title;
        tooltip.style.top = (rect.top + rect.height / 2) + 'px';
        tooltip.style.left = '88px';
        tooltip.classList.add('visible');
      }
    });
    
    document.addEventListener('mouseout', function(e) {
      const item = e.target.closest('.nav-item');
      if (item) {
        tooltip.classList.remove('visible');
      }
    });
  }

  function applyCompanyLogo(dataUrl) {
    if (!dataUrl) dataUrl = localStorage.getItem('sd_company_logo');
    if (dataUrl) {
      localStorage.setItem('sd_company_logo', dataUrl);
      const previewLogo = document.getElementById('admin-logo-preview');
      if (previewLogo) previewLogo.src = dataUrl;
    }
  }

  function renderSkeletonCards(count, minHeight) {
    let html = '';
    for (let i = 0; i < (count || 4); i++) {
      html += `
        <div class="skeleton-card" style="min-height:${minHeight || 110}px;">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-metric"></div>
          <div class="skeleton skeleton-text" style="width:75%;"></div>
        </div>
      `;
    }
    return html;
  }

  function renderSkeletonRows(count) {
    let html = '';
    for (let i = 0; i < (count || 5); i++) {
      html += `
        <tr>
          <td><div class="skeleton skeleton-text" style="width:120px;"></div></td>
          <td><div class="skeleton skeleton-text" style="width:80px;"></div></td>
          <td><div class="skeleton skeleton-text" style="width:90px;"></div></td>
          <td><div class="skeleton skeleton-pill"></div></td>
          <td><div class="skeleton skeleton-text" style="width:60px;"></div></td>
        </tr>
      `;
    }
    return html;
  }

  function newRequestId() {
    return 'req_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
  }

  function navigateTo(moduleName) {
    const target = moduleName || 'dashboard';
    window.location.hash = target;
  }

  function handleRoute() {
    const hash = window.location.hash.replace('#', '') || 'dashboard';
    App.currentModule = hash;

    // Update active nav state in sidebar
    document.querySelectorAll('.nav-item').forEach(el => {
      const href = el.getAttribute('href');
      el.classList.toggle('active', href === '#' + hash);
    });

    // Update breadcrumb in topbar
    const breadcrumbEl = document.getElementById('topbar-breadcrumb-module');
    if (breadcrumbEl) {
      const titles = {
        dashboard: 'Dashboard',
        directory: 'Directory',
        attendance: 'Attendance & Timesheet',
        leave: 'Leave & Time Off',
        holidays: 'Holiday Calendar',
        policies: 'Company Policies',
        assets: 'Assets & Equipment',
        rewards: 'Rewards & Recognition',
        appraisals: 'My Appraisals',
        travel: 'Travel & Expenses',
        letters: 'My Letters',
        payroll: 'My Payroll',
        resignation: 'Resignation & Clearance',
        profile: 'My Profile',
        admin: 'Admin Console'
      };
      breadcrumbEl.textContent = titles[hash] || hash;
    }

    // Hide all modules, show target module
    document.querySelectorAll('.module-container').forEach(el => {
      el.style.display = 'none';
    });

    const targetModule = document.getElementById('module-' + hash);
    if (targetModule) {
      targetModule.style.display = 'block';
      loadModuleData(hash);
    } else {
      console.warn('Module container not found for hash:', hash);
      const dash = document.getElementById('module-dashboard');
      if (dash) dash.style.display = 'block';
    }
  }

  window.addEventListener('hashchange', handleRoute);

  function loadModuleData(moduleName) {
    const fnName = 'loadModule_' + moduleName;
    if (typeof window[fnName] === 'function') {
      window[fnName]();
    }
  }

  function initApp() {
    applySidebarState();
    renderIconsInDOM();
    handleRoute();

    callApi('getInitialAppData', [], function(data) {
      if (!data) return;
      App.user = data.user || App.user;
      App.nav = data.nav || App.nav;
      App.orgName = data.orgName || App.orgName;
      App.currency = data.currency || App.currency;
      App.punchStatus = data.punchStatus || App.punchStatus;

      // Update User in Topbar & Sidebar
      const nameEl = document.getElementById('topbar-user-name');
      const roleEl = document.getElementById('topbar-user-role');
      const orgEl = document.getElementById('sidebar-org-name');
      const avatar = document.getElementById('topbar-avatar');

      if (nameEl && data.user) nameEl.textContent = data.user.fullName || 'Employee';
      if (roleEl && data.user) roleEl.textContent = (data.user.role || 'Staff') + (data.user.department ? ' • ' + data.user.department : '');
      if (orgEl && data.orgName) orgEl.textContent = data.orgName;

      if (avatar && data.user) {
        if (data.user.photoUrl) {
          avatar.innerHTML = `<img src="${data.user.photoUrl}" alt="${data.user.fullName}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else if (data.user.fullName) {
          avatar.textContent = data.user.fullName.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
        }
      }

      if (data.punchStatus && typeof updatePunchButtonUI === 'function') {
        updatePunchButtonUI(data.punchStatus.isPunchedIn, data.punchStatus.todayRecord);
      }
      if (typeof renderSidebarNav === 'function') {
        renderSidebarNav(data.nav);
      }
      if (data.companyLogo) {
        applyCompanyLogo(data.companyLogo);
      }
      renderIconsInDOM();
      handleRoute();
      if (typeof syncDashboardToUserRole === 'function') {
        syncDashboardToUserRole();
      }
      initNavTooltips();
    }, function(err) {
      console.warn('Initial data load warning:', err);
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    initTheme();
    initApp();
    applyCompanyLogo(); // load from localStorage instantly to avoid flicker
    setTimeout(initNavTooltips, 1000);
  });
</script>
