<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    /* StackDrove HRMS Branding & UI Style Guide v1.0 Tokens */
    --sd-navy: #0B1635;             /* Primary brand / navigation / headings */
    --sd-primary: #2563EB;          /* Royal Blue: functional action / active states / links */
    --sd-primary-hover: #1D4ED8;
    --sd-primary-light: #EFF6FF;
    --sd-accent-green: #22C55E;     /* Bright Green: success / positive accent */
    --sd-accent-green-light: #DCFCE7;
    
    /* Neutrals & Surfaces */
    --sd-bg: #F5F7FA;               /* Soft Gray: Page background / section separation */
    --sd-surface: #FFFFFF;          /* White: Primary surface / cards / forms */
    --sd-surface-subtle: #F8FAFC;
    --sd-border: #E5E7EB;           /* Border Gray: Borders / dividers */
    --sd-border-light: #F1F5F9;
    
    /* Text Hierarchy */
    --sd-text-primary: #232D3C;     /* Text Charcoal: Primary body text */
    --sd-text-secondary: #475569;
    --sd-text-muted: #64748B;       /* Muted Text: Secondary metadata */
    
    /* Status & Alerts (Brand Guide Section 7) */
    --sd-danger: #DC2626;           /* Danger Red: Errors / destructive actions */
    --sd-danger-light: #FEE2E2;
    --sd-warning: #D97706;          /* Warning Amber: Warnings / attention states */
    --sd-warning-light: #FEF3C7;
    --sd-success: #22C55E;          /* Semantic Green: Approved / present */
    --sd-success-light: #DCFCE7;

    /* Sidebar Chrome */
    --sd-sidebar-bg: #0B1635;       /* Dark Navy Surface */
    --sd-sidebar-text: #94A3B8;
    --sd-sidebar-text-active: #FFFFFF;
    --sd-sidebar-active: #2563EB;   /* Royal Blue active navigation item */
    --sd-sidebar-hover: rgba(255, 255, 255, 0.08);
    --sd-sidebar-border: rgba(255, 255, 255, 0.08);

    /* Dimensions & Restrained Radius (10-14px per guide) */
    --sd-sidebar-width: 250px;
    --sd-sidebar-collapsed-width: 80px;
    --sd-topbar-height: 64px;
    --sd-radius-sm: 6px;
    --sd-radius-md: 10px;           /* Standard button & form radius */
    --sd-radius-lg: 12px;           /* Standard card radius */
    --sd-radius-xl: 14px;
    --sd-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
    --sd-shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    --sd-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
    --sd-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.06), 0 4px 6px -4px rgba(0, 0, 0, 0.02);
    --sd-transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    background-color: var(--sd-bg) !important;
    font-family: 'Aptos', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--sd-text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* App Layout Shell */
  #app-root {
    display: flex !important;
    height: 100vh !important;
    width: 100vw !important;
    overflow: hidden !important;
    position: relative;
    background-color: var(--sd-bg);
  }

  /* Left Sidebar Navigation - Dark Navy Surface */
  #sidebar-wrapper, .sidebar, #sidebar {
    width: var(--sd-sidebar-width) !important;
    min-width: var(--sd-sidebar-width) !important;
    max-width: var(--sd-sidebar-width) !important;
    background-color: var(--sd-sidebar-bg) !important;
    color: var(--sd-sidebar-text) !important;
    flex-shrink: 0 !important;
    height: 100vh !important;
    position: sticky;
    top: 0;
    display: flex !important;
    flex-direction: column !important;
    z-index: 40;
    border-right: 1px solid var(--sd-sidebar-border) !important;
    transition: var(--sd-transition);
  }

  /* Fallback layout to prevent overlap if flex wrappers are missing in Apps Script */
  #sidebar-wrapper ~ #topbar,
  #sidebar-wrapper ~ main,
  #sidebar-wrapper ~ #module-viewport {
    width: calc(100% - var(--sd-sidebar-width)) !important;
    margin-left: var(--sd-sidebar-width) !important;
    transition: var(--sd-transition);
  }
  #sidebar-wrapper.collapsed ~ #topbar,
  #sidebar-wrapper.collapsed ~ main,
  #sidebar-wrapper.collapsed ~ #module-viewport {
    width: calc(100% - var(--sd-sidebar-collapsed-width)) !important;
    margin-left: var(--sd-sidebar-collapsed-width) !important;
  }

  /* Collapsed Sidebar State */
  #sidebar-wrapper.collapsed {
    width: var(--sd-sidebar-collapsed-width) !important;
    min-width: var(--sd-sidebar-collapsed-width) !important;
    max-width: var(--sd-sidebar-collapsed-width) !important;
  }
  /* Sidebar Header & Brand Layout */
  #sidebar-header {
    padding: 14px 14px 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 64px;
    box-sizing: border-box;
    position: relative;
    transition: var(--sd-transition);
  }
  .sidebar-brand-container {
    display: flex;
    align-items: center;
    gap: 11px;
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }
  .sidebar-brand-badge {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    transition: var(--sd-transition);
  }
  .sidebar-brand-badge:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .sidebar-brand-img {
    width: 24px;
    height: 28px;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
  }
  .sidebar-brand-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    overflow: hidden;
  }
  .sidebar-brand-title {
    font-size: 15px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: -0.2px;
    line-height: 1.2;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  .sidebar-system-title {
    font-size: 11px;
    font-weight: 500;
    color: #94A3B8;
    letter-spacing: 0.2px;
    line-height: 1.2;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  /* Specificity-proof styling for Sidebar Collapse Toggle Button */
  #btn-sidebar-collapse,
  .sidebar-toggle-btn {
    width: 28px !important;
    height: 28px !important;
    min-width: 28px !important;
    max-width: 28px !important;
    min-height: 28px !important;
    max-height: 28px !important;
    padding: 0 !important;
    margin: 0 !important;
    border-radius: 6px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: #94A3B8 !important;
    cursor: pointer !important;
    flex-shrink: 0 !important;
    transition: var(--sd-transition) !important;
  }
  #btn-sidebar-collapse:hover,
  .sidebar-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.12) !important;
    color: #FFFFFF !important;
    border-color: rgba(255, 255, 255, 0.2) !important;
  }

  /* Chevron state for toggle button */
  #sidebar-wrapper:not(.collapsed) #btn-sidebar-collapse .icon-chevron-right,
  #sidebar-wrapper:not(.collapsed) .sidebar-toggle-btn .icon-chevron-right {
    display: none !important;
  }
  #sidebar-wrapper:not(.collapsed) #btn-sidebar-collapse .icon-chevron-left,
  #sidebar-wrapper:not(.collapsed) .sidebar-toggle-btn .icon-chevron-left {
    display: block !important;
  }

  /* Collapsed Sidebar Header State (Matches Reference Image 3 in 80px standard width) */
  #sidebar-wrapper.collapsed #sidebar-header {
    padding: 14px 8px !important;
    justify-content: space-between !important;
    gap: 4px !important;
  }
  #sidebar-wrapper.collapsed .sidebar-brand-container {
    flex: 0 0 auto !important;
    gap: 0 !important;
  }
  #sidebar-wrapper.collapsed .sidebar-brand-badge {
    width: 36px !important;
    height: 36px !important;
    min-width: 36px !important;
    border-radius: 8px !important;
  }
  #sidebar-wrapper.collapsed .sidebar-brand-img {
    width: 22px !important;
    height: 26px !important;
  }
  #sidebar-wrapper.collapsed .sidebar-brand-text {
    display: none !important;
  }
  #sidebar-wrapper.collapsed #btn-sidebar-collapse,
  #sidebar-wrapper.collapsed .sidebar-toggle-btn {
    width: 24px !important;
    height: 28px !important;
    min-width: 24px !important;
    max-width: 24px !important;
    padding: 0 !important;
    border-radius: 5px !important;
    background: rgba(255, 255, 255, 0.08) !important;
  }
  #sidebar-wrapper.collapsed #btn-sidebar-collapse .icon-chevron-left,
  #sidebar-wrapper.collapsed .sidebar-toggle-btn .icon-chevron-left {
    display: none !important;
  }
  #sidebar-wrapper.collapsed #btn-sidebar-collapse .icon-chevron-right,
  #sidebar-wrapper.collapsed .sidebar-toggle-btn .icon-chevron-right {
    display: block !important;
  }

  #sidebar-wrapper.collapsed .sidebar-tagline,
  #sidebar-wrapper.collapsed .nav-section-title,
  #sidebar-wrapper.collapsed .sidebar-footer-text,
  #sidebar-wrapper.collapsed .nav-text,
  #sidebar-wrapper.collapsed .nav-item span:not(.icon-slot) {
    display: none !important;
  }
  /* Spacious Standard 80px Collapsed Row Width */
  #sidebar-wrapper.collapsed .nav-item {
    justify-content: center !important;
    padding: 10px 0 !important;
    margin: 4px auto !important;
    width: 56px !important;
    height: 44px !important;
    border-radius: 10px !important;
    position: relative;
    font-size: 0 !important; /* Force hide any bare text nodes */
    color: transparent !important;
  }
  #sidebar-wrapper.collapsed .nav-item svg,
  #sidebar-wrapper.collapsed .nav-item i,
  #sidebar-wrapper.collapsed .nav-item .icon-slot {
    margin: 0 !important;
    font-size: 20px !important; /* Restore icon size if it's a font icon */
    color: var(--sd-sidebar-text) !important; /* Restore icon color */
  }
  /* Global Nav Tooltip for Collapsed Sidebar */
  .sd-nav-tooltip {
    position: fixed;
    background: #0B1635;
    color: #FFFFFF;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    z-index: 10000;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.12);
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .sd-nav-tooltip.visible {
    opacity: 1;
  }

  /* Main Viewport Area */
  #main-content-wrapper {
    flex: 1 !important;
    display: flex !important;
    flex-direction: column !important;
    min-width: 0 !important;
    overflow-y: auto !important;
    height: 100vh !important;
    background-color: var(--sd-bg) !important;
    transition: var(--sd-transition);
  }

  /* Topbar Header - Crisp White Bar */
  #topbar, .topbar {
    height: var(--sd-topbar-height) !important;
    min-height: var(--sd-topbar-height) !important;
    max-height: var(--sd-topbar-height) !important;
    background: var(--sd-surface) !important;
    border-bottom: 1px solid var(--sd-border) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 28px !important;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  #module-viewport {
    flex: 1 !important;
    padding: 28px 32px !important;
    background-color: var(--sd-bg) !important;
  }

  .content-container {
    max-width: 1440px;
    margin: 0 auto;
    width: 100%;
  }

  /* Typography Hierarchy per Brand Guide Section 5 */
  h1, h2, h3, h4, h5 { color: var(--sd-navy); font-weight: 700; letter-spacing: -0.3px; }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--sd-navy); }
  .page-subtitle { font-size: 13.5px; color: var(--sd-text-muted); margin-top: 3px; }

  /* Cards - Subtle Border, Restrained 10-14px Radius, Minimal Shadow */
  .card {
    background: var(--sd-surface);
    border: 1px solid var(--sd-border);
    border-radius: var(--sd-radius-lg);
    box-shadow: var(--sd-shadow-card);
    padding: 24px;
    transition: var(--sd-transition);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .card-title { font-size: 15px; font-weight: 600; color: var(--sd-navy); }

  /* Buttons - Royal Blue Primary, White Outlined Secondary, Red Destructive */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: var(--sd-radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: var(--sd-transition);
    text-decoration: none;
    line-height: 1;
    font-family: inherit;
  }
  .btn-primary { background: var(--sd-primary); color: #FFFFFF; border: none; }
  .btn-primary:hover { background: var(--sd-primary-hover); }
  .btn-secondary { background: var(--sd-surface); border-color: var(--sd-border); color: var(--sd-text-primary); }
  .btn-secondary:hover { background: var(--sd-surface-subtle); border-color: #CBD5E1; }
  .btn-danger { background: var(--sd-danger); color: #FFFFFF; border: none; }
  .btn-danger:hover { background: #B91C1C; }
  .btn-sm { padding: 7px 14px; font-size: 12.5px; }
  .btn-icon {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: var(--sd-radius-md);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--sd-surface);
    border: 1px solid var(--sd-border);
    color: var(--sd-text-secondary);
    cursor: pointer;
    transition: var(--sd-transition);
  }
  .btn-icon:hover { background: var(--sd-surface-subtle); color: var(--sd-navy); border-color: #CBD5E1; }

  /* Sidebar Toggle Button */
  .sidebar-toggle-btn {
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--sd-radius-sm);
    background: transparent;
    border: 1px solid transparent;
    color: var(--sd-text-muted);
    cursor: pointer;
    transition: var(--sd-transition);
  }
  .sidebar-toggle-btn:hover {
    background: #F1F5F9;
    color: var(--sd-navy);
  }
  .sidebar-toggle-btn.dark {
    color: #94A3B8;
  }
  .sidebar-toggle-btn.dark:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
  }

  /* Sidebar Navigation Items */
  .nav-item, #sidebar-wrapper a, #sidebar-wrapper button:not(.sidebar-toggle-btn),
  .sidebar a, .sidebar button:not(.sidebar-toggle-btn) {
    display: flex;
    align-items: center;
    gap: 12px;
    width: calc(100% - 24px);
    margin: 2px 12px;
    padding: 9px 14px;
    border-radius: var(--sd-radius-md);
    color: var(--sd-sidebar-text) !important;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    transition: var(--sd-transition);
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    font-family: inherit;
    text-align: left;
    box-sizing: border-box;
  }
  .nav-item:hover, #sidebar-wrapper a:hover, #sidebar-wrapper button:not(.sidebar-toggle-btn):hover,
  .sidebar a:hover, .sidebar button:not(.sidebar-toggle-btn):hover {
    background: var(--sd-sidebar-hover) !important;
    color: #FFFFFF !important;
  }
  .nav-item.active, #sidebar-wrapper a.active, #sidebar-wrapper button:not(.sidebar-toggle-btn).active,
  .sidebar a.active, .sidebar button:not(.sidebar-toggle-btn).active {
    background: var(--sd-primary) !important;
    color: #FFFFFF !important;
    font-weight: 600;
  }

  /* ============================================================
     Buttons & Action Styles (StackDrove Design System v1.0)
     ============================================================ */
  .button, .btn {
    display: inline-flex;
    align-items: center !important;
    justify-content: center !important;
    gap: 8px !important;
    padding: 8px 16px !important;
    border-radius: var(--sd-radius-md, 10px) !important;
    font-size: 13.5px !important;
    font-weight: 600 !important;
    font-family: inherit !important;
    line-height: 1.25 !important;
    cursor: pointer !important;
    text-decoration: none !important;
    border: 1px solid transparent !important;
    transition: var(--sd-transition, all 0.18s cubic-bezier(0.4, 0, 0.2, 1)) !important;
    user-select: none !important;
    box-sizing: border-box !important;
    outline: none !important;
  }
  .button[style*="display: none"], .btn[style*="display: none"],
  .button[style*="display:none"], .btn[style*="display:none"],
  .button.hidden, .btn.hidden {
    display: none !important;
  }
  .button:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--sd-primary) !important;
    outline-offset: 2px !important;
  }
  .button:disabled, .btn:disabled {
    opacity: 0.55 !important;
    cursor: not-allowed !important;
    transform: none !important;
    box-shadow: none !important;
  }

  /* Primary Button (StackDrove Royal Blue #2563EB) */
  .button-primary, .btn-primary {
    background: #2563EB !important;
    color: #FFFFFF !important;
    border-color: #2563EB !important;
    box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3) !important;
  }
  .button-primary:hover, .btn-primary:hover {
    background: #1D4ED8 !important;
    border-color: #1D4ED8 !important;
    color: #FFFFFF !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 4px 10px -1px rgba(37, 99, 235, 0.35) !important;
  }
  .button-primary:active, .btn-primary:active {
    background: #1E40AF !important;
    transform: translateY(0) !important;
  }

  /* Secondary Button (Clean crisp white surface) */
  .button-secondary, .btn-secondary {
    background: #FFFFFF !important;
    color: #232D3C !important;
    border: 1px solid #E2E8F0 !important;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
  }
  .button-secondary:hover, .btn-secondary:hover {
    background: #F8FAFC !important;
    border-color: #CBD5E1 !important;
    color: #0B1635 !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06) !important;
  }
  .button-secondary:active, .btn-secondary:active {
    background: #F1F5F9 !important;
    transform: translateY(0) !important;
  }

  /* Ghost Button (Transparent with royal blue text) */
  .button-ghost, .btn-ghost {
    background: transparent !important;
    color: #2563EB !important;
    border: 1px solid transparent !important;
    box-shadow: none !important;
    padding: 6px 12px !important;
  }
  .button-ghost:hover, .btn-ghost:hover {
    background: #EFF6FF !important;
    color: #1D4ED8 !important;
  }
  .button-ghost:active, .btn-ghost:active {
    background: #DBEAFE !important;
  }

  /* Sizes */
  .button-sm, .btn-sm {
    padding: 5px 11px !important;
    font-size: 12px !important;
    border-radius: var(--sd-radius-sm, 6px) !important;
    gap: 5px !important;
  }
  .button-lg, .btn-lg {
    padding: 11px 22px !important;
    font-size: 14.5px !important;
    border-radius: var(--sd-radius-md, 10px) !important;
  }

  /* Form Elements */
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--sd-text-primary); margin-bottom: 6px; }
  .form-control, .filter-select {
    width: 100%;
    padding: 9px 14px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--sd-text-primary);
    background: var(--sd-surface);
    border: 1px solid var(--sd-border);
    border-radius: var(--sd-radius-md);
    transition: var(--sd-transition);
    outline: none;
  }
  .form-control:focus, .filter-select:focus {
    border-color: var(--sd-primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  textarea.form-control { min-height: 85px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 12.5px; font-weight: 600; color: var(--sd-text-secondary); }

  /* Tables - Sticky Header, Crisp Dividers, Compact Row Heights */
  .table-container {
    background: var(--sd-surface);
    border: 1px solid var(--sd-border);
    border-radius: var(--sd-radius-lg);
    box-shadow: var(--sd-shadow-card);
    overflow-x: auto;
  }
  .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  .data-table th {
    background: var(--sd-surface-subtle);
    color: var(--sd-text-muted);
    font-weight: 600;
    padding: 11px 18px;
    border-bottom: 1px solid var(--sd-border);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .data-table td {
    padding: 13px 18px;
    border-bottom: 1px solid var(--sd-border-light);
    color: var(--sd-text-primary);
    vertical-align: middle;
  }
  .data-table tr:hover td { background-color: #F8FAFC; }

  /* Status Badges / Pills - Strictly Following Section 7 Semantics */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 9999px;

  .pill-approved, .pill-present, .pill-active { background: #DCFCE7; color: #15803D; } /* #22C55E Green */

  /* Org Tree Visual Nodes */
  .org-tree-node {

  .avatar {

  /* SVG Icons */

  }

    display: inline-flex;
    align-items: center;
    justify-content: center;

  /* Skeleton Shimmer Loading System */
  @keyframes sd-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .skeleton {
    background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%) !important;
    background-size: 200% 100% !important;
    animation: sd-shimmer 1.5s infinite ease-in-out !important;
    border-radius: 6px;
    color: transparent !important;
    user-select: none;
    pointer-events: none;
    border: none !important;
  }

  .skeleton-text {
    height: 14px;
    border-radius: 4px;
    margin-bottom: 6px;
    display: inline-block;
  }
  .skeleton-title {
    height: 22px;
    width: 45%;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .skeleton-metric {
    height: 32px;
    width: 60px;
    border-radius: 6px;
    margin: 6px 0;
  }
  .skeleton-card {
    background: var(--sd-surface);
    border: 1px solid var(--sd-border);
    border-radius: var(--sd-radius-lg);
    padding: 24px;
  }
  .skeleton-row {
    height: 48px;
    margin-bottom: 8px;
    border-radius: 8px;
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(11, 22, 53, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease-out;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .modal-dialog {
    background: var(--sd-surface);
    border-radius: var(--sd-radius-xl);
    width: 90%;
    max-width: 560px;
    box-shadow: var(--sd-shadow-lg);
    border: 1px solid var(--sd-border);
    overflow: hidden;
  }
  .modal-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--sd-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--sd-border);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    background: var(--sd-surface-subtle);
  }

  /* Bottom Floating Pop-up Notifications (Matches Screenshot 2) */
  #toast-container {
    position: fixed !important;
    bottom: 28px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 100005 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 10px !important;
    pointer-events: none !important;
    width: auto !important;
    max-width: 90vw !important;
  }
  .toast {
    pointer-events: auto !important;
    padding: 10px 22px !important;
    border-radius: 9999px !important;
    background: #0B1635 !important;
    color: #FFFFFF !important;
    box-shadow: 0 12px 30px -4px rgba(11, 22, 53, 0.45), 0 4px 12px -2px rgba(0, 0, 0, 0.2) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    font-size: 13.5px !important;
    font-weight: 500 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 10px !important;
    animation: bottomToastSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
    white-space: nowrap !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
  }
  .toast.toast-success {
    border-color: rgba(34, 197, 94, 0.35) !important;
  }
  .toast.toast-error {
    border-color: rgba(220, 38, 38, 0.45) !important;
  }
  .toast.toast-warning {
    border-color: rgba(217, 119, 6, 0.45) !important;
  }

  @keyframes bottomToastSlideUp {
    from { transform: translateY(22px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ============================================================

  /* Layout Grids */
  .grid-2-1 {

  /* Card Headings */

    flex-direction: column;
